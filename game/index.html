<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR — an original open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SOLMAR: drive, steal cars, outrun the police and work 12 story missions across the coastal city of Solmar"></canvas>
<p id="status" role="status" aria-live="polite">SOLMAR — an original 2D top-down open-world crime game. Press Enter on the title screen to start.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
